name: Bug report
description: Something behaves differently from the design or the docs.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems go through private reporting, not here. Thanks for taking the time to report a bug.
  - type: input
    id: package
    attributes:
      label: Package and version
      description: e.g. `@leed-ai/git-gateway-worker@0.3.1`, or a commit on main.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Storage backend
      options: [Cloudflare Artifacts, GitLab, In-memory (testkit), Not backend-specific]
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: git client version
      description: Output of `git --version`, if a git client is involved.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands or RPC calls that shows the problem. Redact credentials.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or protocol output
      description: e.g. `GIT_TRACE_PACKET=1 GIT_CURL_VERBOSE=1 git push` output, with tokens removed.
      render: text
