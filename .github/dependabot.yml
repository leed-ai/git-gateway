# SPDX-License-Identifier: Apache-2.0
# Weekly dependency updates. Peer ranges (zod ^4, hono ^4, cloudflare ^5) are never rewritten:
# a new major is a deliberate policy change in tooling/repo/src/peer-policy.ts.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 10
    groups:
      toolchain:
        patterns:
          ['vite-plus', 'turbo', 'typescript', 'wrangler', '@cloudflare/*', '@types/*', '@changesets/*']
      peers:
        patterns: ['zod', 'hono', 'cloudflare']
      test:
        patterns: ['fast-check']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
