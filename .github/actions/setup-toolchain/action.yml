# SPDX-License-Identifier: Apache-2.0
name: Set up toolchain
description: Node (from .node-version), Bun (from packageManager), frozen dependency install, and the Turbo cache restored from the Actions cache.

inputs:
  cache-key:
    description: Distinguishes this job's Turbo cache from other jobs (e.g. "check", "test-2").
    required: true
  registry-url:
    description: npm registry to write an .npmrc for (publishing jobs only); empty for none.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        registry-url: ${{ inputs.registry-url }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Restore the Turbo cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.cache-key }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ inputs.cache-key }}-
