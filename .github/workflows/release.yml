# SPDX-License-Identifier: Apache-2.0
# Changesets releases: opens or updates the version PR; once it is merged, publishes the new
# versions to npm with provenance. Without an NPM_TOKEN secret nothing is published: only the
# version PR is maintained.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: github.repository == 'leed-ai/git-gateway' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # version commits and release tags
      pull-requests: write # the version PR
      id-token: write # npm provenance
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain
        with:
          cache-key: release
          registry-url: https://registry.npmjs.org

      - name: Build the packages
        run: bunx turbo run build --filter='./packages/*'

      - name: Version PR (publishing is off without NPM_TOKEN)
        if: env.HAS_NPM_TOKEN != 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: bun run version-packages
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version PR or publish
        if: env.HAS_NPM_TOKEN == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: bun run version-packages
          publish: bun run release:publish
          title: 'chore: release packages'
          commit: 'chore: release packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
