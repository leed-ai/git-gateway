# SPDX-License-Identifier: Apache-2.0
# Every npm publish of @leed-ai/git-gateway-* comes from this one file, because an npm trusted
# publisher names exactly one workflow file per package. docs/RELEASING.md has the setup.
#
# What triggers what:
#   push to main             -> maintain the Changesets "chore: release packages" pull request, and
#                               publish every package as 0.x.y-next.<datetime> under the `next`
#                               dist-tag (only once the NPM_PUBLISHING repository variable is 'true').
#   workflow_dispatch        -> mode `release` (default): publish the versions on main under `latest`,
#                               then tag them and create GitHub releases. Run it after merging the
#                               release pull request. mode `snapshot`: the `next` publish, by hand.
#                               `dry_run` (default true) builds, packs and runs `npm publish --dry-run`.
#
#   gh workflow run release.yml                      # dry run of a release: what would ship
#   gh workflow run release.yml -f dry_run=false     # ship it
#
# Authentication is npm trusted publishing (OIDC): no npm token or secret exists anywhere. Only the
# `publish` job holds `id-token: write`, and it runs nothing but `npm publish` of tarballs packed by
# the `pack` job: no `bun install`, no build, no tests, so no third-party dev dependency ever runs
# beside the credential. npm attaches provenance to an OIDC publish automatically.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'release: publish the versions on main under latest. snapshot: publish a next snapshot.'
        type: choice
        options: [release, snapshot]
        default: release
      dry_run:
        description: 'Build, pack and npm publish --dry-run; publish, tag and release nothing'
        type: boolean
        default: true

permissions:
  contents: read

# Releases and snapshots queue separately: a pending release is never replaced by a later push.
# Never cancelled half-way, which would leave some packages published and some not.
concurrency:
  group: release-${{ (github.event_name == 'push' || inputs.mode == 'snapshot') && 'next' || 'latest' }}
  cancel-in-progress: false

jobs:
  # Keeps the Changesets version pull request up to date. Publishes nothing and holds no OIDC token.
  version-pr:
    name: version pull request
    if: github.repository == 'leed-ai/git-gateway' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the version branch
      pull-requests: write # the version pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain
        with:
          cache-key: version-pr

      - name: Open or update the release pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version-packages
          pr-title: 'chore: release packages'
          commit-message: 'chore: release packages'
        env:
          # The version script runs @changesets/changelog-github, which reads the token from the env.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Everything that runs third-party code: install, checks, tests, build and pack. Read-only, no OIDC.
  pack:
    name: verify and pack (${{ github.event_name == 'push' && 'snapshot' || inputs.mode }})
    if: github.repository == 'leed-ai/git-gateway'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.mode.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Decide what this run publishes
        id: mode
        env:
          MODE: ${{ github.event_name == 'push' && 'snapshot' || inputs.mode }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          NPM_PUBLISHING: ${{ vars.NPM_PUBLISHING }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$MODE" in
            release) tag=latest ;;
            snapshot) tag=next ;;
            *) echo "::error::unknown mode '$MODE'"; exit 1 ;;
          esac
          if [[ "$DRY_RUN" != true ]]; then
            if [[ "$REF" != refs/heads/main ]]; then
              echo "::error::Only main publishes; run with dry_run for $REF."
              exit 1
            fi
            if [[ "$NPM_PUBLISHING" != true ]]; then
              if [[ "$MODE" == release ]]; then
                echo "::error::npm publishing is not set up: the NPM_PUBLISHING repository variable is not 'true'. See docs/RELEASING.md."
                exit 1
              fi
              echo "::notice::NPM_PUBLISHING is not 'true': the next snapshot is verified and packed, not published. See docs/RELEASING.md."
            fi
          fi
          {
            echo "mode=$MODE"
            echo "tag=$tag"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          cache-key: release

      # A dry run carries on past it, so the pipeline can be exercised before the version PR merges.
      - name: Refuse a release with unversioned changesets
        if: steps.mode.outputs.mode == 'release'
        continue-on-error: ${{ steps.mode.outputs.dry_run == 'true' }}
        run: bun tooling/repo/src/cli/check-release-ready.ts

      - name: Check, test, build and policy (bun run verify)
        run: bun run verify

      - name: Contract suite against the in-memory backend
        env:
          CONTRACT_BACKEND: memory
        run: bun run test:contract

      # The snapshot changeset and version bumps stay in this job's checkout; nothing is committed.
      # @changesets/changelog-github still writes changelog entries in snapshot mode and looks up
      # each changeset's commit and PR on GitHub, which needs a token; the per-run one is enough.
      - name: Give every public package a next version
        if: steps.mode.outputs.mode == 'snapshot'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun tooling/repo/src/cli/write-snapshot-changeset.ts
          bunx changeset version --snapshot next

      - name: Build the packages
        run: bunx turbo run build --filter='./packages/*'

      - name: Pack every package not yet on npm
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: bun tooling/repo/src/cli/pack-packages.ts --tag "$TAG" --out "$RUNNER_TEMP/npm-packages"

      - name: Ask npm what it would publish
        run: bun tooling/repo/src/cli/publish-packages.ts --from "$RUNNER_TEMP/npm-packages" --dry-run

      - name: Plan
        id: plan
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/npm-packages/plan.json"
          count="$(jq '.packages | length' "$plan")"
          {
            suffix=""
            [[ "$DRY_RUN" == true ]] && suffix=" (dry run: nothing is published)"
            echo "### ${count} package(s) under \`$(jq -r .tag "$plan")\`${suffix}"
            jq -r '.packages[] | "- `\(.name)@\(.version)`"' "$plan"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$count" == 0 && "$MODE" == release && "$DRY_RUN" != true ]]; then
            echo "::error::Every package is already on npm at its current version. Merge the release pull request first."
            exit 1
          fi
          publish=false
          [[ "$DRY_RUN" != true && "$count" != 0 ]] && publish=true
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Hand the tarballs to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # The only job that can publish. It holds `id-token: write` and runs nothing but `npm publish`.
  publish:
    name: publish to npm (${{ needs.pack.outputs.tag }})
    needs: pack
    if: >-
      github.repository == 'leed-ai/git-gateway' &&
      github.ref == 'refs/heads/main' &&
      vars.NPM_PUBLISHING == 'true' &&
      needs.pack.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    # A kill partway through a publish leaves some packages out; re-running skips what is on npm.
    timeout-minutes: 20
    # **The environment is what pins the ref.** A trusted publisher matches repository and workflow
    # filename, with no branch field, and workflow_dispatch runs this file from whichever ref the
    # dispatcher names. The npm-publish environment admits only main, and every trusted publisher is
    # registered with `--env npm-publish`, so npm refuses a token minted anywhere else.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); provenance comes from the same identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No registry-url: no .npmrc and no placeholder token, so npm authenticates through OIDC alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Trusted publishing needs npm 11.5.1 or later; never rely on whichever npm the Node release bundles.
      - name: Use npm 11.5.1 or later
        run: |
          npm install --global npm@^11.5.1
          npm --version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Fetch the packed tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages

      # No `bun install`: the script imports Node builtins only.
      - name: Publish
        run: bun tooling/repo/src/cli/publish-packages.ts --from "$RUNNER_TEMP/npm-packages"

  # Tags and GitHub releases for a `latest` publish, after it has succeeded. No OIDC.
  github-releases:
    name: tag and release
    needs: [pack, publish]
    if: github.repository == 'leed-ai/git-gateway' && github.ref == 'refs/heads/main' && needs.pack.outputs.tag == 'latest'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # tags and releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Fetch the published plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages

      - name: Create the tags and GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bun tooling/repo/src/cli/create-releases.ts --from "$RUNNER_TEMP/npm-packages" --target "$GITHUB_SHA"
