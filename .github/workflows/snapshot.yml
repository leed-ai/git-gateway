# SPDX-License-Identifier: Apache-2.0
# Every merge to main publishes all packages under the `next` dist-tag as 0.x.y-next.<timestamp>,
# with provenance, so consumers' CI can run against the latest gateway before a release.
# Without an NPM_TOKEN secret it builds the snapshot versions and publishes nothing.
name: snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  next:
    name: publish next
    if: github.repository == 'leed-ai/git-gateway' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          cache-key: snapshot
          registry-url: https://registry.npmjs.org

      # The snapshot changeset and version bumps stay in this job's checkout; nothing is committed.
      # @changesets/changelog-github still writes changelog entries in snapshot mode and looks up
      # each changeset's commit and PR on GitHub, which needs a token; the per-run one is enough.
      - name: Give every public package a next version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun tooling/repo/src/cli/write-snapshot-changeset.ts
          bunx changeset version --snapshot next

      - name: Build the packages
        run: bunx turbo run build --filter='./packages/*'

      - name: Publish under the next dist-tag
        if: env.HAS_NPM_TOKEN == 'true'
        run: bun run release:snapshot
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Note that publishing is off
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::notice::NPM_TOKEN is not configured; snapshot versions were built but not published."
